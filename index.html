<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nweather</title>
    <link rel="icon" type="image/svg" href="wolk.svg">
    <style>

        @font-face {
            font-family: Nothing_Font; /* set name */
            src: url(Ndot57-Regular.otf); /* url of the font */
        }

        @font-face {
            font-family: inter; /* set name */
            src: url(Inter-Light.otf); /* url of the font */
        }

        body{
            margin:0;
            padding:0;
            background-color: #000000;
            color:white;
        }

        #menusvg{
            fill:white;
            width:9dvw;
            margin-left:2dvw;
        }

        #refreshsvg{
            fill:white;
            width:7dvw;
            position:absolute;
            right:2dvw;
            top:1.5dvw;
            transform: rotate(0deg);
            transition: 0.5s;
        }

        #fixedbar{
            width:100dvw;
            height:28dvw;
            display:flex;
            flex-direction:column;
            padding-top:2dvw;
            position:fixed;
            top:0;
            background-color:black;
            z-index:99;
        }

        #derest{
            z-index:1;
            border-radius:35px 35px 0px 0px;
            margin-top:30dvw;
            overflow-y: scroll;
            height:calc(100dvh - 30dvw);
            width:96dvw;
            margin-left:2dvw;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-timeline-name: --main-scroll;
            scroll-timeline-axis: block;
        }

        #derest::-webkit-scrollbar {
            display: none;
        }

        #part1, #part2{
            display:flex;
            flex-direction:row;
            position:relative;
            height:10dvw;
        }

        #currenttemp{
            font-size:12dvw;
            font-family: Nothing_Font;
            position:absolute;
            left:2dvw;
            top:0%;
            transform: translate(0%,-50%);
        }

        #locationname{
            font-family: Nothing_Font;
            font-size:6dvw;
            line-height: 1;
            position:absolute;
            height:9dvw;
            left:50%;
            top:10%;
            transform: translate(-50%,-50%);
        }

        img:not([src]), 
        img[src=""] {
            opacity: 0;
            transition:0.3s;
        }

         #loader{
            width:14dvw;
            height:10dvw;
            border:none;
            outline:none;
            position:absolute;
            top: 70dvw;
            left:50%;
            transform: translate(-50%,-50%);
            user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            opacity:0.5;
            display:flex;
            z-index:998;
        }

        #currentweathericon{
            width:40dvw;
            height:40dvw;
            margin-left:28dvw;
            margin-top:30dvw;
            border:none;
            outline:none;
            animation:scrollanimatie linear;
            animation-timeline: --main-scroll;
            animation-range: cover 0% exit 100%;
            user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            -webkit-tap-highlight-color: transparent;
            outline:none;
        }

        svg, div, img {
            user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            -webkit-tap-highlight-color: transparent;
            outline:none;
        }

        @keyframes scrollanimatie {
            to{
                transform: scale(0.2);
                opacity:0;
            }
        }

        #hourtemp{
            width:92dvw;
            padding-left:2dvw;
            padding-right:2dvw;
            height:35dvw;
            border-radius:15px;
            background-color: #313131;
            display:flex;
            flex-direction:row;
            gap:8dvw;
            flex-shrink: none;
            overflow-x: scroll;
            -ms-overflow-style: none;
            scrollbar-width: none;
            transition:0.3s;
        }

        #hourrain{
            width:92dvw;
            padding-left:2dvw;
            padding-right:2dvw;
            height:35dvw;
            border-radius:15px;
            background-color: #313131;
            /*margin-top:2dvw;*/
            display:block;
            flex-direction:row;
            gap:8dvw;
            flex-shrink: none;
            overflow-x: scroll;
            -ms-overflow-style: none;
            scrollbar-width: none;
            transition:0.3s;
        }

        #chartwrapper{
            width:170dvw;
            height:35dvw;
            position: relative;
            transition:0.3s;
        }

        #hourtemp::-webkit-scrollbar {
            display: none;
        }

        .uurblok img {
            width:12dvw;
            transition:0.3s;
            position:absolute;
            top:50%;
            transform: translateY(-50%);
        }

        .uurblok{
            width:15dvw;
            flex-shrink: 0;
            display:flex;
            align-items: center;
            justify-content: center;
            flex-direction:column;
            font-family: inter;
            font-size:4dvw;
            transition:0.3s;
            position:relative;
        }

        #uurblok0{
            margin-left:2dvw;
        }

        .uurblokuur{
            position:absolute;
            top:0;
            transform: translateY(-50%);
        }

        .uurbloktemp{
            position:absolute;
            bottom:0;
            transform: translateY(50%);
        }

        .square{
            width:47dvw;
            height:47dvw;
            border-radius:15px;
            background-color:#313131;
            font-family: Nothing_Font;
            display:flex;
            align-items: center;
            justify-content: center;
            transition:0.3s;
        }

        .circle{
            width:47dvw;
            height:47dvw;
            border-radius:50%;
            background-color:#313131;
            font-family: Nothing_Font;
            display:flex;
            align-items: center;
            justify-content: center;
            transition:0.3s;
        }

        #charts{
            display:flex;
            flex-direction:row;
            flex-wrap:wrap;
            width:96dvw;
            margin-top:32dvw;
            margin-bottom:15dvw;
            gap:2dvw;
        }

        h1, h2, h3, h4, h5, p, svg, img, div{
            user-select: none;
        }

        #sunrisesvg{
            width:28dvw;
            position:absolute;
            top:20%;
        }

        #sunrise{
            display:flex;
            flex-direction:column;
            position:relative;
        }

        #sunrisetekst{
            font-size:7dvw;
            display:flex;
            margin:0;
            padding:0;
            position:absolute;
            top:60%;
            transition:0.3s;
        }

        #windrichting{
            width:18dvw;
            margin-top:-5dvw;
            transition:0.3s;
        }

        #winddirection{
            position:relative;
        }

        #windspeed{
            position:absolute;
            bottom:-8%;
            left:50%;
            transform:translate(-50%,-50%);
            transition:0.3s;
        }

        #uv{
            overflow:hidden;
            position:relative;
        }

        #air{
            position:relative;
        }

        #uvindextekst{
            font-size:5.5dvw;
            position:absolute;
            left:50%;
            top:0%;
            transform: translate(-50%,-50%);
        }

        #airtekst{
            font-size:5.5dvw;
            position:absolute;
            left:50%;
            top:10%;
            transform: translate(-50%,-50%);
            margin:0;
            padding:0;
            width:45dvw;
            text-align: center;
        }

        #uvtekst{
            font-size:7dvw;
        }

        #uvmeter{
            position:absolute;
            bottom:0;
            left:0;
            width:50dvw;
            height:0dvw;
            background-color:#ff0000;
            transition:0.3s;
        }

        #airsvg{
            width:42dvw;
            position:absolute;
            top:50%;
            left:50%;
            transform: translate(-50%,-50%);
        }

        #airpressure{
            position:absolute;
            top:50%;
            left:40%;
            transform: translate(-50%,-50%);
            margin:0;
            font-size:4dvw;
        }

        #dagen{
            width:92dvw;
            padding:2dvw;
            height:61dvw;
            border-radius:15px;
            /*margin-top:2dvw;*/
            background-color: #313131;
            display:flex;
            flex-direction:column;
            gap:2dvw;
            flex-shrink: none;
            overflow-x: scroll;
            -ms-overflow-style: none;
            scrollbar-width: none;
            transition:0.3s;
        }

        .dag{
            width:96%;
            padding-left:2%;
            padding-right:2%;
            height:7dvw;
            display:flex;
            gap:8dvw;
            align-items: center;
            justify-content: flex-start;
            flex-direction:row;
            font-family: Nothing_Font;
            background-color: #404040;
            border-radius:calc(15px - 2dvw);
            position:relative;
        }

        .dag h3{
            font-size:4.5dvw;
            width:17dvw;
            text-align: left;
            margin:0;
            line-height: 1;
            flex-shrink: 0;
            display:flex;
            align-items: center;
            align-self: center;
        }

        .dag .max{
            text-align: right;
        }

        .dag img{
           position:absolute;
           left:11dvw;
           height:4dvw;
           width:11dvw;
        }

        #locationsection{
            padding:0;
            width:100dvw;
            height:100dvh;
            position:fixed;
            top:0;
            left:0;
            background-color: #000000;
            display:none;
            z-index:999;
        }

        #backsvg{
            width: 8dvw;
            fill: white;
            position:absolute;
            right:3dvw;
            top:4dvw;
            cursor:pointer;
            transform: scale(1);
            transition: 0.3s;
            user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            -webkit-tap-highlight-color: transparent;
            outline:none;
        }

        #loctext{
            font-family: Nothing_Font;
            margin:0;
            margin-left:2.5dvw;
            margin-top:3.8dvw;
            font-size:11dvw;
        }

        #searchdiv{
            width:96dvw;
            height:15dvw;
            position:fixed;
            top:21dvw;
            left:2dvw;
            background-color: #404040;
            border-radius:50px;
        }

        #searchinput{
            height:13dvw;
            width:88dvw;
            padding:0;
            margin-left:5dvw;
            margin-top:1.1dvw;
            border:none;
            outline:none;
            background-color: transparent;
            color:white;
            font-family:Nothing_font;
            font-size:5dvw;
            line-height:1;
        }

        #searchdiv svg{
            height: 6dvw;
            fill: #a7a7a7;
            position:absolute;
            right:4.5dvw;
            top:4.5dvw;
            cursor:pointer;
        }

        #locationlijst{
            width:96dvw;
            height:calc(100dvh - 35dvw);
            position:fixed;
            top:39dvw;
            left:2dvw;
            display:flex;
            flex-direction: column;
            gap:2dvw;
            border-radius:15px;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .location{
            width:100%;
            height:17dvw;
            border-radius:15px;
            flex-shrink: 0;
            background-color: #404040;
            display:flex;
            align-items: center;
            position:relative;
        }

        .location h2{
            font-family: Nothing_font;
            font-size:7dvw;
            margin:0;
            line-height: 1;
            margin-left:3dvw;
            cursor:pointer;
        }

        .location svg{
            height: 6dvw;
            fill: #a7a7a7;
            position:absolute;
            right:4dvw;
            top:5.5dvw;
            cursor:pointer;
            transform: scale(1);
            transition: 0.3s;
            user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            -webkit-tap-highlight-color: transparent;
            outline:none;
        }

        .location svg:active{
            transform: scale(1.1);
            transition: 0.3s;
        }

        #refreshsvg.spinning{
            animation: refreshani 0.85s ease;
            transition: 0.5s;
        }

        @keyframes refreshani{
            0%{
                transform: rotate(0deg);
            }
            50%{
                transform: rotate(125deg);
            }
            100%{
                transform: rotate(0deg);
            }
        }

        #specificdaydiv{
            width:calc(100dvw - 4px);
            height:115dvw;
            outline:2px solid white;
            position:fixed;
            left:2px;
            bottom:0;
            border-radius: 25px 25px 0px 0px;
            background-color: #313131;
            display:none;
            z-index:995;
            flex-direction:column;
            padding-top:5dvw;
            flex-shrink: 0;
            align-items: center;
            transform: translateY(120dvw);
            transition: transform 0.3s ease;
        }

        #daytext{
            font-size:8dvw;
            font-family: Nothing_Font;
            width:75dvw;
            text-align: center;
            line-height: 1;
            height:10dvw;
        }

        #sdaytemp {
            font-size:15dvw;
            font-family: Nothing_Font;
            width:60dvw;
            text-align: left;
            position:absolute;
            top:19dvw;
            left:3dvw;
            height:20dvw;
            line-height: 1;
        }

        #sdaywicon {
            font-size:15dvw;
            font-family: Nothing_Font;
            width:15dvw;
            text-align: left;
            position:absolute;
            top:21dvw;
            right:3dvw;
        }

        #sdayhourtemp{
            width:90dvw;
            padding-left:2dvw;
            padding-right:2dvw;
            height:35dvw;
            border-radius:15px;
            background-color: #404040;
            display:flex;
            flex-direction:row;
            gap:8dvw;
            flex-shrink: none;
            overflow-x: scroll;
            -ms-overflow-style: none;
            scrollbar-width: none;
            transition:0.3s;
            position:absolute;
            top:40dvw;
        }

        #sdayrainchart{
            width:90dvw;
            padding-left:2dvw;
            padding-right:2dvw;
            height:35dvw;
            border-radius:15px;
            background-color: #404040;
            display:flex;
            flex-direction:row;
            gap:8dvw;
            flex-shrink: none;
            overflow-x: scroll;
            -ms-overflow-style: none;
            scrollbar-width: none;
            transition:0.3s;
            position:absolute;
            top:77dvw;
        }

        #sdaychartwrapper{
            width:170dvw;
            height:35dvw;
            position: relative;
            transition:0.3s;
        }

        #sdayclosesvg{
            width:7dvw;
            height:7dvw;
            fill:white;
            position:absolute;
            top:5dvw;
            right:3dvw;
        }
    </style>
</head>

                    for(let i = ((24 * weatherday) - momenteeluur); i < ((24 * weatherday) - momenteeluur) + 24; i++){
                        if(result.hourly.precipitation[i] > rainmax){
                            rainmax = result.hourly.precipitation[i];
                        }
                        dagregendata.push(result.hourly.precipitation[i]);
                    }
                    console.log(rainmax);
                    var algevonden = 0;
                    for(let i = 0; i < yasmax.length; i++){
                        if(rainmax < yasmax[i] && algevonden === 0){
                            yasmaxbesluit = yasmax[i];
                            algevonden = 1;
                        } 
                        if(i === (yasmax.length - 1) && algevonden === 0){
                            console.log("meer dan 50!?");
                            yasmaxbesluit = rainmax + 0.3;
                        }
                    }
                    console.log(yasmaxbesluit);


                    const canvas = document.getElementById("sdayregengrafiek");
                    sgrafiek = new Chart(canvas, {
                        type: 'line',
                        data: {
                            labels: uren,
                            datasets: [{
                                label: 'rain (mm)',
                                data: dagregendata,

                                borderColor: '#ff0000',          // Kleur van de lijn (bijv. oranje)
                                backgroundColor: 'transparent',    // Kleur ONDER de lijn (33 maakt het transparant)
                                pointRadius: 0,
                                pointHoverRadius:0,
                                borderWidth: 2,
                                fill: false,
                                tension: 0.2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: {
                                mode: 'index',
                                intersect: false
                            },
                            plugins: {
                                legend: {
                                    display: false
                                },
                                tooltip: {
                                    enabled: true
                                }
                            },
                            scales: {
                                x: {
                                    grid: {
                                        display:false
                                    },
                                    ticks: {
                                        maxRotation: 0,
                                        minRotation: 0,
                                    }
                                },
                                y: {
                                    grid: {
                                        display:false
                                    },
                                    min: 0,
                                    max: yasmaxbesluit
                                }
                            }
                        }
                    })
                    document.getElementById("specificdaydiv").style.transform = "translateY(0dvw)";

            })
            .catch((error) => console.error(error));
        }

        function sluitdayweather(){
            document.getElementById("specificdaydiv").style.transform = "translateY(120dvw)";
            setTimeout(function () {
                document.getElementById("specificdaydiv").style.display = "none";
            },300);
        }
    </script>
</body>
